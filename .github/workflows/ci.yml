name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go for privileged service
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: native/tun-service/go.sum

      - name: Install dependencies (including development)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Validate brand configuration
        run: npm run brand:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Test and cross-compile privileged TUN service
        run: |
          npm run tun-service:test
          npm run tun-service:build

      - name: Build
        run: npm run build

  kernel-real-windows:
    name: Real mihomo kernel integration (Windows)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MURGE_RUN_REAL_KERNEL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (including development)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      # The watchdog cleanup's symlink/junction/reparse-point escape protection
      # must actually run on Windows, not just on the ubuntu verify job: the
      # directory links here create real junctions ('junction' type) and the
      # assertions prove an external sentinel survives a symlinked workspace /
      # configDir / mihomo-workspace-* child. This runs via plain `node` (not
      # vitest) because Node's native ESM loader imports the shared
      # kernel-watchdog-cleanup.mjs here, whereas vitest's Windows transform
      # cannot statically/dynamically import that `.mjs`. It starts no real
      # mihomo, only exercises the cleanup logic against synthetic directories.
      - name: Run watchdog cleanup & symlink/junction escape checks (Windows)
        shell: pwsh
        run: node scripts/kernel-watchdog-symlink-escape.check.mjs

      # Downloads and SHA-256-verifies the pinned official mihomo (win32/x64),
      # then starts/stops/restarts it against an isolated loopback-only config.
      # Safety is enforced by the config schema before any file is written:
      # mode direct, tun/dns disabled, external-controller + secret on
      # 127.0.0.1, allow-lan:false, rules MATCH,DIRECT. The test also asserts
      # only 127.0.0.1 listeners on the two ports it opened, differs a host
      # network snapshot before/after, and records the live PID + ports to
      # $RUNNER_TEMP so the watchdog below can kill exactly that process.
      - name: Run real kernel integration test (gated)
        shell: pwsh
        run: npx vitest run tests/mihomo-kernel.integration.test.ts

      # P2 #11: must run even on failure/crash. Kill ONLY the PID recorded by
      # the test and verify the listener ports + temp config are released. The
      # evidence file never contains the controller secret. Reuses the same
      # scripts/kernel-watchdog-cleanup.mjs the fault-injection test below calls,
      # so CI is not testing a duplicate copy.
      - name: Kill recorded mihomo PID & verify cleanup (finally)
        if: always()
        shell: pwsh
        run: node scripts/kernel-watchdog-cleanup.mjs --evidence "$env:RUNNER_TEMP\mihomo-real-kernel-evidence.json" --require-evidence --allowed-workspace-roots "$env:TEMP" --allowed-workspace-roots "$env:TMP" --allowed-workspace-roots "$env:RUNNER_TEMP"

      # Sanitized evidence only (PID, ports, workspace path) — never the secret.
      - name: Upload kernel evidence (sanitized)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-real-evidence
          path: ${{ runner.temp }}/mihomo-real-kernel-evidence.json
          if-no-files-found: warn

      # P1 acceptance gap: the finally step above never actually exercised the
      # "find & kill the watchdog-restarted residual mihomo" branch on a green
      # run, because the test process had already exited before the finally ran.
      # This dedicated fault-injection step starts a REAL mihomo, triggers a
      # watchdog restart, records the recovery PID into its own evidence file, then
      # SIGKILLs its own worker WITHOUT calling supervisor.stop() so the recovered
      # kernel is truly orphaned. It then runs the EXACT SAME
      # scripts/kernel-watchdog-cleanup.mjs as the finally step and asserts it
      # reaped a live process, freed both ports and removed the workspace.
      - name: Fault-inject watchdog restart & verify external cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = npx vitest run tests/mihomo-kernel-cleanup-fault.integration.test.ts 2>&1
          $logText = ($log | Out-String)
          Write-Output $logText
          # The crash-driver test intentionally SIGKILLs its own worker, so vitest
          # exits non-zero — that is expected. The marker is what proves the test
          # actually reached and orphaned a live restarted kernel.
          if ($logText -notmatch 'CRASH-DRIVER-REACHED-CRASH-POINT') {
            Write-Error 'crash marker not reached — fault injection did not orphan the kernel'
            exit 1
          }
          # The recovered PID must be durably recorded before the crash point.
          $faultEvidence = "$env:RUNNER_TEMP\mihomo-cleanup-fault-evidence.json"
          if (-not (Test-Path $faultEvidence)) {
            Write-Error "fault evidence file missing: $faultEvidence"
            exit 1
          }
          $cleanupLog = node scripts/kernel-watchdog-cleanup.mjs --evidence $faultEvidence --require-evidence --allowed-workspace-roots "$env:TEMP" --allowed-workspace-roots "$env:TMP" --allowed-workspace-roots "$env:RUNNER_TEMP" 2>&1
          Write-Output $cleanupLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'watchdog cleanup failed during fault injection'
            exit 1
          }
          # Prove the reaper actually killed a LIVE recorded process (not a no-op
          # on a test that had already cleaned up).
          if (($cleanupLog | Out-String) -notmatch 'stopping recorded PID') {
            Write-Error 'cleanup did not reap a live recorded PID — no orphan was killed'
            exit 1
          }
          Write-Output 'KERNEL_FAULT_INJECTION=PASS'

  system-proxy-real-windows:
    name: Real system-proxy enable/restore (Windows)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MURGE_RUN_REAL_SYSTEM_PROXY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (including development)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      # Record the pre-run per-user HKCU proxy baseline so the `if: always()`
      # final step can prove the proxy was restored to its ORIGINAL state rather
      # than merely "left some value". A fresh Windows runner normally has it
      # disabled (ProxyEnable=0/absent), but capturing the real baseline removes
      # any flakiness from a runner image that already had a proxy configured.
      # Captures the pre-run per-user HKCU proxy baseline via
      # scripts/system-proxy-snapshot.ps1. It reads through the SAME .NET
      # RegistryKey reader as the app/recovery helper (exact strings + exact
      # registry types) because Get-ItemPropertyValue THROWS on a missing named
      # property in GH Actions pwsh even with -ErrorAction SilentlyContinue
      # (P1 #1), so a never-set ProxyServer / ProxyOverride would fail the
      # baseline capture outright.
      - name: Capture pre-run HKCU system-proxy baseline
        shell: pwsh
        run: |
          $json = & pwsh -NoProfile -File scripts/system-proxy-snapshot.ps1
          $json | Out-File -FilePath "$env:RUNNER_TEMP\system-proxy-baseline.json" -Encoding utf8
          $baseline = $json | ConvertFrom-Json
          Write-Host "baseline: $json"
          Write-Host "baseline ProxyEnable exists=$($baseline.proxyEnable.exists) type=$($baseline.proxyEnable.type) value=$($baseline.proxyEnable.value)"

      # Registers the per-user HKCU system proxy (ProxyServer/ProxyEnable/
      # ProxyOverride on 127.0.0.1), then proves WinHTTP, default routes, DNS,
      # adapters and firewall profiles were NOT touched — only the HKCU Internet
      # Settings proxy field changed. The test restores the exact original values
      # in a `finally` block, so a failing assertion can never leave the host's
      # proxy changed. No socket is bound (nothing is actually served), so no real
      # traffic is proxied. The integration test is gated inside itself by the
      # MURGE_RUN_REAL_SYSTEM_PROXY env var + win32, so it only runs here. It also
      # forces-kills an owner process mid-apply and verifies the STANDALONE
      # scripts/recover-system-proxy.mjs helper restores it (see the test body).
      - name: Run real system-proxy enable/restore test (gated)
        shell: pwsh
        run: npx vitest run tests/system-proxy-real.integration.test.ts

      # P1 #5: must run even on failure/crash. Run the SAME standalone
      # recover-system-proxy.mjs the test uses, against the real default app-data
      # owned backup. If the test crashed mid-apply and left the proxy enabled,
      # this restores it; if the test already restored and deleted the backup it is
      # a safe no-op (disabled, exit 0). Then prove the HKCU proxy is back to the
      # exact pre-run baseline (exists + registry type + raw value for all three),
      # via scripts/system-proxy-verify.ps1. A genuine restore failure (exit 1)
      # fails CI.
      - name: Restore orphaned system proxy & verify final consistency (finally)
        if: always()
        shell: pwsh
        run: |
          $restoreLog = node scripts/recover-system-proxy.mjs 2>&1
          Write-Output $restoreLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'external system-proxy restore failed'
            exit 1
          }
          & pwsh -NoProfile -File scripts/system-proxy-verify.ps1 `
            -Baseline "$env:RUNNER_TEMP\system-proxy-baseline.json" `
            -Label 'SYSTEM_PROXY_FINAL_CONSISTENCY'
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'final system-proxy state does not match the pre-run baseline'
            exit 1
          }
          Write-Host 'SYSTEM_PROXY_FINAL_CONSISTENCY=PASS'


  package-win:
    name: Package Windows & smoke-test NSIS installer
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go for privileged service
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: native/tun-service/go.sum

      - name: Install dependencies (including development)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Resolve brand environment
        shell: pwsh
        run: |
          $brand = Get-Content brand.config.json -Raw | ConvertFrom-Json
          "PRODUCT_NAME=$($brand.productName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_ID=$($brand.appId)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXECUTABLE_NAME=$($brand.executableName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Build once, then package. Strategy A: `buildUniversalInstaller: false`
      # produces exactly two per-arch installers (x64 + arm64) and never the
      # combined multi-arch one, so CI never uploads ~373MB of redundant files.
      - name: Build renderer/main
        run: npm run build

      - name: Download and verify installer-bundled mihomo archives
        run: npm run kernel:prepare

      - name: Test and build privileged TUN service
        run: |
          npm run tun-service:test
          npm run tun-service:build

      - name: Package Windows NSIS (x64 + arm64)
        run: npx electron-builder --win --config electron-builder.config.mjs --publish never
        env:
          # Signing is intentionally disabled for CI smoke builds. Real signing
          # needs a certificate and is an owner decision — see docs/CODE_SIGNING.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify notices are retained in the packaged artifact
        shell: pwsh
        run: |
          # The unpacked application (produced by a package step) must contain the
          # notices and every retained dependency license, not just the source tree.
          $notices = Get-ChildItem -Path dist -Recurse -Filter 'THIRD_PARTY_NOTICES.md' -File | Select-Object -First 1
          if (-not $notices) { throw 'THIRD_PARTY_NOTICES.md missing from the packaged artifact' }
          Write-Host "notices: $($notices.FullName)"
          if (-not (Test-Path (Join-Path $notices.DirectoryName 'SOURCE_CODE.md'))) { throw 'SOURCE_CODE.md missing from the packaged artifact' }
          $unpackedRoot = Split-Path -Parent $notices.DirectoryName
          foreach ($electronNotice in @('LICENSE.electron.txt','LICENSES.chromium.html')) {
            if (-not (Test-Path (Join-Path $unpackedRoot $electronNotice))) { throw "$electronNotice missing from the packaged artifact" }
          }
          $licensesDir = Join-Path $notices.DirectoryName 'licenses'
          $expected = @('vue.txt','vue-router.txt','pinia.txt','vueuse-core.txt','zod.txt','ws.txt','yaml.txt','electron.txt','electron-toolkit-utils.txt','electron-toolkit-preload.txt','go-winio.txt','go-x-sys.txt','go-yaml-v3.txt')
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $licensesDir $name))) {
              throw "license file $name missing from the packaged artifact"
            }
          }
          Write-Host "retained license files: $($expected.Count)"

      - name: Install, verify & uninstall Windows NSIS (x64, hosted-safe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$ArgumentList = @(),
              [Parameter(Mandatory = $true)][string]$Label,
              [int]$TimeoutSeconds = 120
            )

            # On a headless runner the packaged app may not receive its command
            # line; the app reads a MURGE_CI_BOOT_FLAGS env var as a fallback
            # channel. Export the same flags, then clear them so a later plain
            # GUI launch (UI smoke) is not mistaken for a probe.
            $env:MURGE_CI_BOOT_FLAGS = ($ArgumentList -join ' ')
            try {
              $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                Write-Warning "$Label timed out after $TimeoutSeconds seconds (pid=$($process.Id)); terminating its process tree"
                & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
                throw "$Label timed out after $TimeoutSeconds seconds"
              }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                throw "$Label exited with code $($process.ExitCode)"
              }
              return $process
            } finally {
              Remove-Item Env:MURGE_CI_BOOT_FLAGS -ErrorAction SilentlyContinue
            }
          }

          $installer = Get-ChildItem -Path 'dist' -Filter "*Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw 'x64 NSIS installer not found' }
          Write-Host "installer: $($installer.FullName)"

          # Phase 9B installs a LocalSystem service, so the installer is per-machine.
          $null = Invoke-BoundedProcess -FilePath $installer.FullName -ArgumentList '/S' -Label 'silent installer' -TimeoutSeconds 180
          Start-Sleep -Seconds 3

          # Locate the per-machine installed executable; retain legacy fallbacks
          # so this smoke keeps diagnosing an accidental packaging regression.
          $installDir = Join-Path $env:ProgramFiles $env:PRODUCT_NAME
          $exe = Join-Path $installDir "$env:EXECUTABLE_NAME.exe"
          if (-not (Test-Path $exe)) {
            $unreg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_ID" -ErrorAction SilentlyContinue
            if (-not $unreg) { $unreg = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_ID" -ErrorAction SilentlyContinue }
            if ($unreg.InstallLocation) {
              $installDir = $unreg.InstallLocation
              $exe = Join-Path $installDir "$env:EXECUTABLE_NAME.exe"
            }
          }
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem $env:ProgramFiles -Recurse -Filter "$env:EXECUTABLE_NAME.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            if (-not $exe) { throw 'murge.exe not found after install' }
            $installDir = Split-Path -Parent $exe
          }
          Write-Host "install dir: $installDir"
          Write-Host "murge.exe: $exe"
          if (-not (Test-Path (Join-Path $installDir 'app.ico'))) { Write-Host 'note: no app.ico in install dir (icon name may vary)' }
          $version = (Get-Item $exe).VersionInfo
          Write-Host "ProductName=$($version.ProductName) ProductVersion=$($version.ProductVersion)"
          if ($version.ProductName -ne $env:PRODUCT_NAME) { throw "installed ProductName '$($version.ProductName)' != '$env:PRODUCT_NAME'" }

          # Validate the actual installed application archive. ELECTRON_RUN_AS_NODE
          # below proves only that the executable can host Node; it deliberately
          # bypasses app.asar and therefore is not an application-entry check.
          $asar = Join-Path $installDir 'resources\app.asar'
          if (-not (Test-Path $asar)) { throw "installed app.asar missing: $asar" }
          $asarEntries = @(& node node_modules/@electron/asar/bin/asar.js list $asar)
          if ($LASTEXITCODE -ne 0) { throw 'installed app.asar could not be read' }
          $asarEntries = @($asarEntries | ForEach-Object { $_.Replace('\','/').TrimStart('/') })
          $requiredAsarEntries = @(
            'package.json',
            'out/main/index.js',
            'out/preload/index.js',
            'out/renderer/index.html'
          )
          foreach ($entry in $requiredAsarEntries) {
            if ($asarEntries -notcontains $entry) { throw "installed app.asar missing required entry: $entry" }
          }
          Write-Host "installed app.asar readable with required entries: PASS"

          # Ground truth: can the installed binary execute our JS at all? Run it as
          # plain Node via ELECTRON_RUN_AS_NODE=1, which bypasses Chromium, GPU,
          # the display and app.asar entirely and just evaluates a tiny script. If
          # it prints + writes a sentinel + exits, the executable can host Node.
          # This does NOT load app.asar or prove the Electron application entry.
          $nodeScript = Join-Path $env:RUNNER_TEMP 'electron-node-probe.js'
          $nodeSentinel = Join-Path $env:RUNNER_TEMP 'electron-node-sentinel.txt'
          Set-Content -Path $nodeScript -Value 'const fs=require("fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/electron-node-sentinel.txt","ok");console.log("ELECTRON_RUN_AS_NODE_OK");process.exit(0)' -Encoding utf8
          $nodeOut = Join-Path $env:RUNNER_TEMP 'electron-node.out.txt'
          $nodeErr = Join-Path $env:RUNNER_TEMP 'electron-node.err.txt'
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $nodeProc = Start-Process -FilePath $exe -ArgumentList $nodeScript -PassThru `
              -RedirectStandardOutput $nodeOut -RedirectStandardError $nodeErr
            if (-not $nodeProc.WaitForExit(30000)) {
              Write-Host '=== ELECTRON_RUN_AS_NODE TIMED OUT (30s): binary cannot run even as Node ==='
              Write-Host '--- node stdout ---'; if (Test-Path $nodeOut) { Get-Content $nodeOut -Tail 20 }
              Write-Host '--- node stderr ---'; if (Test-Path $nodeErr) { Get-Content $nodeErr -Tail 60 }
              & taskkill.exe /PID $nodeProc.Id /T /F 2>$null | Out-Null
              throw 'ELECTRON_RUN_AS_NODE timed out: binary cannot run as Node on this runner'
            }
            Write-Host "ELECTRON_RUN_AS_NODE exit code: $($nodeProc.ExitCode)"
            Write-Host "node sentinel written: $(Test-Path $nodeSentinel)"
            Write-Host '--- node stdout ---'; if (Test-Path $nodeOut) { Get-Content $nodeOut -Tail 20 }
            Write-Host '--- node stderr ---'; if (Test-Path $nodeErr) { Get-Content $nodeErr -Tail 60 }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          }

          $serviceTemplate = Get-Content (Join-Path $installDir 'resources\tun-service\service-template.json') -Raw | ConvertFrom-Json
          $tunService = Get-Service -Name $serviceTemplate.serviceName -ErrorAction Stop
          if ($tunService.Status -ne 'Running') { throw "TUN service is not running after install: $($tunService.Status)" }
          if (Get-Process -Name 'mihomo' -ErrorAction SilentlyContinue) { throw 'idle TUN service unexpectedly started mihomo' }
          Write-Host "idle privileged service installed: $($serviceTemplate.serviceName)"

          $sentinelRoot = Join-Path $env:APPDATA $env:APP_ID 'profiles'
          $sentinel = Join-Path $sentinelRoot '.packaging-smoke-sentinel'
          New-Item -ItemType Directory -Path $sentinelRoot -Force | Out-Null
          Set-Content -Path $sentinel -Value 'hosted-package-smoke' -Encoding utf8
          $ownedBackup = Join-Path $env:APPDATA 'system-proxy\owned-backup.json'

          # The hosted runner does not execute Electron probes. Capture the exact
          # proxy baseline now and prove install/uninstall leaves it unchanged.
          $pkgBaseJson = & pwsh -NoProfile -File scripts/system-proxy-snapshot.ps1
          $pkgBaseJson | Out-File -FilePath "$env:RUNNER_TEMP\system-proxy-package-baseline.json" -Encoding utf8
          Write-Host "hosted package system-proxy baseline: $pkgBaseJson"

          # Electron/Chromium launch, preload IPC, tray and installed-app command
          # probes require an interactive Windows desktop. They remain here as the
          # authoritative sequence for the separate self-hosted GUI workflow, but
          # are intentionally not executed on GitHub's hosted Windows service.
          $interactiveDesktop = $false
          if ($interactiveDesktop) {

          # Snapshot listening ports so we can prove the smoke created no listener.
          $beforePorts = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty LocalPort

          # Launch the CI-only production probe (no window, no kernel, no socket).
          # Capture stdout/stderr so a startup stall is diagnosable, and surface
          # the app's own watchdog marker + sentinel state on timeout instead of
          # a blind 120s hang.
          $smokeOut = Join-Path $env:RUNNER_TEMP 'packaging-smoke.stdout.log'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'packaging-smoke.stderr.log'
          $sentinel = Join-Path $sentinelRoot '.packaging-smoke-sentinel'
          $smokeArgv = Join-Path $env:RUNNER_TEMP 'murge-argv.json'
          $bootMarker = Join-Path $env:TEMP 'murge-boot-marker.json'
          $bootMarkerRun = Join-Path $env:RUNNER_TEMP 'murge-boot-marker.json'
          $bootMarkerCwd = Join-Path $PWD 'murge-boot-marker.json'
          # GPU/display bootstrap switches: headless Windows runners can stall in
          # Chromium GPU init before the main script even runs. These are consumed
          # at boot, so they help even if the app code cannot.
          $smokeArgs = '--packaging-smoke','--disable-gpu','--disable-software-rasterizer','--no-sandbox'
          $env:MURGE_CI_BOOT_FLAGS = ($smokeArgs -join ' ')
          $env:MURGE_CI_BOOT_DIAG = '1'
          $env:MURGE_CI_BOOT_DIAG_PATH = $smokeArgv
          try {
            $smoke = Start-Process -FilePath $exe -ArgumentList $smokeArgs -PassThru `
              -WorkingDirectory $installDir `
              -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          } finally {
            Remove-Item Env:MURGE_CI_BOOT_FLAGS -ErrorAction SilentlyContinue
          }
          if (-not $smoke.WaitForExit(75000)) {
            Write-Host '=== packaging-smoke stderr (tail) ==='
            if (Test-Path $smokeErr) { Get-Content $smokeErr -Tail 80 }
            Write-Host '=== packaging-smoke stdout (tail) ==='
            if (Test-Path $smokeOut) { Get-Content $smokeOut -Tail 80 }
            Write-Host "sentinel present after timeout: $(Test-Path $sentinel)"
            Write-Host "argv diag present: $(Test-Path $smokeArgv)"
            if (Test-Path $smokeArgv) { Get-Content $smokeArgv -Tail 40 }
            Write-Host "boot marker (temp) present: $(Test-Path $bootMarker)"
            Write-Host "boot marker (runner temp) present: $(Test-Path $bootMarkerRun)"
            Write-Host "boot marker (cwd) present: $(Test-Path $bootMarkerCwd)"
            if (Test-Path $bootMarkerCwd) { Get-Content $bootMarkerCwd -Tail 40 }
            elseif (Test-Path $bootMarkerRun) { Get-Content $bootMarkerRun -Tail 40 }
            elseif (Test-Path $bootMarker) { Get-Content $bootMarker -Tail 40 }
            & taskkill.exe /PID $smoke.Id /T /F 2>$null | Out-Null
            throw 'packaging smoke timed out (see captured output above)'
          }
          $smoke.Refresh()
          Write-Host "packaging-smoke exit code: $($smoke.ExitCode) (expected 0)"
          if ($smoke.ExitCode -ne 0) {
            Write-Host '=== packaging-smoke stderr (tail) ==='
            if (Test-Path $smokeErr) { Get-Content $smokeErr -Tail 80 }
            Write-Host '=== packaging-smoke stdout (tail) ==='
            if (Test-Path $smokeOut) { Get-Content $smokeOut -Tail 80 }
            throw "packaging-smoke exited with code $($smoke.ExitCode)"
          }
          if (-not (Test-Path $sentinel)) { throw "sentinel profile not written at $sentinel" }
          Write-Host "sentinel profile: $sentinel"
          Remove-Item Env:MURGE_CI_BOOT_DIAG -ErrorAction SilentlyContinue
          Remove-Item Env:MURGE_CI_BOOT_DIAG_PATH -ErrorAction SilentlyContinue

          # No real kernel may be running and no new proxy/controller port may listen.
          if (Get-Process -Name 'mihomo' -ErrorAction SilentlyContinue) { throw 'a mihomo process was started during the smoke run' }
          $afterPorts = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty LocalPort
          $newPorts = Compare-Object $beforePorts $afterPorts -PassThru | Where-Object { $_ -eq 9090 }
          if ($newPorts) { throw 'controller port 9090 is listening after the smoke run' }
          Write-Host 'no mihomo process and no new controller listener confirmed'

          # Exercise the installed artifact's bundled kernel end to end. This
          # must not download anything: it verifies and extracts the archive
          # shipped in resources/bin, starts the loopback-only direct config,
          # authenticates /version, then stops and cleans up.
          $kernelProbe = Invoke-BoundedProcess -FilePath $exe -ArgumentList '--kernel-smoke' -Label 'bundled kernel smoke'
          Write-Host "kernel-smoke exit code: $($kernelProbe.ExitCode) (expected 0)"
          if ($kernelProbe.ExitCode -ne 0) { throw "bundled kernel smoke exited with code $($kernelProbe.ExitCode)" }
          if (Get-Process -Name 'mihomo' -ErrorAction SilentlyContinue) { throw 'mihomo remained after bundled kernel smoke' }

          # Load the real renderer + sandboxed preload and perform one typed IPC
          # round-trip. A visible static shell alone is insufficient: a missing
          # preload previously left every live view stuck while this job passed.
          $bridge = Invoke-BoundedProcess -FilePath $exe -ArgumentList '--ui-smoke' -Label 'preload IPC smoke'
          Write-Host "ui-smoke exit code: $($bridge.ExitCode) (expected 0)"
          if ($bridge.ExitCode -ne 0) { throw "preload IPC smoke exited with code $($bridge.ExitCode)" }

          # Login-launch shape: hidden window + native tray + stopped kernel.
          $hidden = Invoke-BoundedProcess -FilePath $exe -ArgumentList '--hidden','--hidden-smoke' -Label 'hidden tray smoke'
          Write-Host "hidden-smoke exit code: $($hidden.ExitCode) (expected 0)"
          if (Get-Process -Name 'mihomo' -ErrorAction SilentlyContinue) { throw 'hidden startup unexpectedly started mihomo' }

          # Launch the REAL packaged GUI path (without a smoke flag) and
          # require a visible native top-level window. The old probe explicitly
          # skipped window creation, so an invisible background-only app could
          # pass CI. Normal launch remains lazy and must not start mihomo or bind
          # a controller until the user explicitly clicks Start.
          $ui = Start-Process -FilePath $exe -PassThru
          $windowReady = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $live = Get-Process -Id $ui.Id -ErrorAction SilentlyContinue
              if (-not $live) { throw 'packaged GUI exited before creating a window' }
              if ($live.MainWindowHandle -ne 0) {
                $windowReady = $true
                Write-Host "visible GUI window: pid=$($live.Id) handle=$($live.MainWindowHandle) title='$($live.MainWindowTitle)'"
                break
              }
            }
            if (-not $windowReady) { throw 'packaged GUI stayed alive but did not create a visible window within 30 seconds' }
            if (Get-Process -Name 'mihomo' -ErrorAction SilentlyContinue) { throw 'normal GUI launch unexpectedly started mihomo' }
            $guiPorts = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty LocalPort
            if ($guiPorts -contains 9090) { throw 'normal GUI launch unexpectedly bound controller port 9090' }
          } finally {
            Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $ui.Id -Timeout 10 -ErrorAction SilentlyContinue
          }
          # Electron can leave renderer/GPU children alive after the browser
          # process is force-stopped. Match the immutable installed executable
          # path (not a broad process name), terminate those children, and prove
          # none still holds the installation directory before uninstall.
          $appProcessDeadline = (Get-Date).AddSeconds(15)
          do {
            $appProcesses = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.Equals($exe, [System.StringComparison]::OrdinalIgnoreCase) })
            foreach ($appProcess in $appProcesses) {
              Stop-Process -Id $appProcess.ProcessId -Force -ErrorAction SilentlyContinue
            }
            if ($appProcesses.Count -gt 0) { Start-Sleep -Milliseconds 250 }
          } while ($appProcesses.Count -gt 0 -and (Get-Date) -lt $appProcessDeadline)
          $appProcesses = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.Equals($exe, [System.StringComparison]::OrdinalIgnoreCase) })
          if ($appProcesses.Count -gt 0) { throw 'packaged GUI child processes did not exit before uninstall' }
          Write-Host 'packaged GUI visibility: PASS'

          # --- install -> enable -> uninstall -> exact-restore (P1 #6) ---
          # Capture the pre-install HKCU proxy baseline (exists + registry type +
          # raw value for all three). The uninstaller's NSIS hook must restore the
          # proxy to exactly this state; uses reg.exe via the snapshot helper (P1
          # #1) so a missing ProxyServer / ProxyOverride does not throw.
          $pkgBaseJson = & pwsh -NoProfile -File scripts/system-proxy-snapshot.ps1
          $pkgBaseJson | Out-File -FilePath "$env:RUNNER_TEMP\system-proxy-package-baseline.json" -Encoding utf8
          $pkgBase = $pkgBaseJson | ConvertFrom-Json
          Write-Host "pre-install system-proxy baseline: $pkgBaseJson"

          # Headlessly enable the per-user HKCU proxy via the installed app. This
          # starts the bundled kernel, reads the LIVE mixed-port and socket-proves
          # it (TCP/HTTP/SOCKS) before writing the owned app-data backup and
          # applying the registry. The kernel is then stopped so the proxy is left
          # pointing at a now-dead loopback port — the exact "orphaned proxy" the
          # uninstaller must undo. Gated so no arbitrary user can manufacture this.
          $enableProbe = Invoke-BoundedProcess -FilePath $exe -ArgumentList '--system-proxy-enable' -Label 'system proxy enable smoke'
          Write-Host "system-proxy-enable exit code: $($enableProbe.ExitCode) (expected 0)"
          if ($enableProbe.ExitCode -ne 0) { throw "system-proxy-enable exited with code $($enableProbe.ExitCode)" }
          $enableSnap = & pwsh -NoProfile -File scripts/system-proxy-snapshot.ps1 | ConvertFrom-Json
          if ($enableSnap.proxyEnable.value -ne 1) { throw "ProxyEnable not set to 1 after headless enable (got '$($enableSnap.proxyEnable.value)')" }
          $ownedBackup = Join-Path $env:APPDATA 'system-proxy\owned-backup.json'
          if (-not (Test-Path $ownedBackup)) { throw "owned system-proxy backup not written at $ownedBackup" }
          Write-Host "owned system-proxy backup: $ownedBackup"

          # Headless Electron probes can return after their browser process while
          # a renderer/GPU child is still draining. Kill only processes whose
          # immutable executable path is this installed app, then prove none can
          # keep Program Files locked before NSIS begins deletion.
          $probeProcessDeadline = (Get-Date).AddSeconds(15)
          do {
            $probeProcesses = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.Equals($exe, [System.StringComparison]::OrdinalIgnoreCase) })
            foreach ($probeProcess in $probeProcesses) {
              Stop-Process -Id $probeProcess.ProcessId -Force -ErrorAction SilentlyContinue
            }
            if ($probeProcesses.Count -gt 0) { Start-Sleep -Milliseconds 250 }
          } while ($probeProcesses.Count -gt 0 -and (Get-Date) -lt $probeProcessDeadline)
          $probeProcesses = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.Equals($exe, [System.StringComparison]::OrdinalIgnoreCase) })
          if ($probeProcesses.Count -gt 0) { throw 'headless probe child processes did not exit before uninstall' }

          }

          # Uninstall silently and confirm program files are gone but app data survives.
          $uninstaller = Get-ChildItem -Path $installDir -Filter 'Uninstall *.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) {
            $unreg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_ID" -ErrorAction SilentlyContinue
            if (-not $unreg) { $unreg = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:APP_ID" -ErrorAction SilentlyContinue }
            if ($unreg.UninstallString) { $uninstaller = @{ FullName = ($unreg.UninstallString -replace '^"([^"]+)".*','$1') } }
          }
          if (-not $uninstaller) { throw 'uninstaller not found' }
          Write-Host "uninstaller: $($uninstaller.FullName)"

          # NSIS reports service-hook failures through a native dialog even for
          # /S, which a hosted service-session runner cannot acknowledge. Prove
          # the installed service bootstrap can remove the exact installed
          # service first, then require the NSIS hook's idempotent no-service
          # path to complete. The interactive workflow remains responsible for
          # the one-shot NSIS service-hook path with a real desktop.
          $installedTunBootstrap = Join-Path $installDir 'resources\tun-service\tun-service.exe'
          if (-not (Test-Path $installedTunBootstrap)) { throw "installed TUN bootstrap missing: $installedTunBootstrap" }
          $null = Invoke-BoundedProcess -FilePath $installedTunBootstrap -ArgumentList '--uninstall' -Label 'installed TUN service removal'
          if (Get-Service -Name $serviceTemplate.serviceName -ErrorAction SilentlyContinue) {
            throw 'installed TUN bootstrap did not remove its service'
          }
          Write-Host 'installed TUN service removal: PASS'

          # No owned proxy was created in this hosted-safe branch, so the NSIS
          # hook sees no durable ownership backup and does not launch Electron.
          $null = Invoke-BoundedProcess -FilePath $uninstaller.FullName -ArgumentList '/S' -Label 'silent uninstaller' -TimeoutSeconds 180
          # NSIS can return after handing final deletion to its cleanup child.
          # Poll the actual installed state instead of racing it with a fixed sleep.
          $uninstallDeadline = (Get-Date).AddSeconds(30)
          while (((Test-Path $exe) -or (Get-Service -Name $serviceTemplate.serviceName -ErrorAction SilentlyContinue)) -and (Get-Date) -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 500
          }

          if (Test-Path $exe) { throw "program files still present after uninstall: $exe" }
          if (Get-Service -Name $serviceTemplate.serviceName -ErrorAction SilentlyContinue) { throw 'TUN service remained registered after uninstall' }
          if (-not (Test-Path $sentinel)) { throw 'sentinel was removed on uninstall; deleteAppDataOnUninstall must stay false' }
          Write-Host 'uninstall removed program files but preserved user data (sentinel survives)'

          # The hosted job never owned the proxy, so install/uninstall must leave
          # the exact captured HKCU values untouched. The interactive self-hosted
          # workflow remains responsible for the owned-proxy restore path.
          & pwsh -NoProfile -File scripts/system-proxy-verify.ps1 `
            -Baseline "$env:RUNNER_TEMP\system-proxy-package-baseline.json" `
            -Label 'UNINSTALL_SYSTEM_PROXY_RESTORE'
          if ($LASTEXITCODE -ne 0) { throw "uninstall did not restore the system proxy to its exact pre-install base" }
          if (Test-Path $ownedBackup) { throw "owned system-proxy backup still present after uninstall: $ownedBackup" }
          Write-Host 'uninstall restored the owned system proxy to its exact pre-enable state: PASS'

          # Clean up the CI-created sentinel so the runner is left clean.
          Remove-Item $sentinel -ErrorAction SilentlyContinue
          Write-Host 'Windows smoke: PASS'

      # P1 #6: run even on failure. If the install/enable/uninstall step failed
      # part-way and left the owned proxy enabled (e.g. after `--system-proxy-enable`
      # but before the uninstaller's restore), the app's owned backup is still in
      # the brand-independent app-data namespace. Run the STANDALONE recovery
      # helper against that path so the HKCU proxy is never left pointing at a dead
      # port, then prove it is back to the pre-install baseline (exists + registry
      # type + raw value). No backup => safe no-op (disabled, exit 0).
      - name: External system-proxy restore & cleanup (finally)
        if: always()
        shell: pwsh
        run: |
          $restoreLog = node scripts/recover-system-proxy.mjs 2>&1
          Write-Output $restoreLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'external system-proxy restore failed after uninstall smoke'
            exit 1
          }
          $baselinePath = "$env:RUNNER_TEMP\system-proxy-package-baseline.json"
          if (Test-Path $baselinePath) {
            & pwsh -NoProfile -File scripts/system-proxy-verify.ps1 `
              -Baseline $baselinePath `
              -Label 'EXTERNAL_SYSTEM_PROXY_RESTORE'
            if ($LASTEXITCODE -ne 0) {
              Write-Error 'external system-proxy restore did not reach the exact pre-install baseline'
              exit 1
            }
          } else {
            # No baseline captured (the main step failed earlier): at minimum prove
            # the registry was not left enabled, via reg.exe (never throws on a
            # missing value).
            $snap = & pwsh -NoProfile -File scripts/system-proxy-snapshot.ps1 | ConvertFrom-Json
            if ($snap.proxyEnable.exists -and $snap.proxyEnable.value -ne 0) {
              Write-Error "HKCU ProxyEnable left enabled ($($snap.proxyEnable.value)) after external restore"
              exit 1
            }
          }
          Write-Host 'EXTERNAL_SYSTEM_PROXY_RESTORE=PASS'

      # A packaging assertion can fail after the per-machine service was
      # installed but before the normal uninstaller runs. Use the same signed-in
      # bootstrap protocol as uninstall (never sc.exe delete) so an owned mihomo
      # must be stopped and confirmed before service removal. Then independently
      # prove SCM no longer contains the service.
      - name: Remove privileged TUN service (finally)
        if: always()
        shell: pwsh
        run: |
          # dist holds BOTH win-unpacked (x64) and win-arm64-unpacked; running
          # the ARM64 bootstrap on an x64 runner fails ("not a valid application
          # for this OS platform"). Exclude the ARM64 tree on an x64 host (so the
          # remaining x64 dir is picked regardless of its exact name) and require
          # it on an ARM64 host before falling back to any packaged template.
          $isArm64Host = ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64')
          $templatePath = Get-ChildItem -Path dist -Recurse -Filter 'service-template.json' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'tun-service' } |
            Where-Object { if ($isArm64Host) { $_.FullName -match 'arm64' } else { $_.FullName -notmatch 'arm64' } } |
            Select-Object -First 1
          if (-not $templatePath) {
            Write-Host 'No packaged service template found; service installation was not reached.'
            exit 0
          }
          $template = Get-Content $templatePath.FullName -Raw | ConvertFrom-Json
          $service = Get-Service -Name $template.serviceName -ErrorAction SilentlyContinue
          if ($service) {
            $bootstrap = Join-Path $templatePath.Directory.FullName 'tun-service.exe'
            if (-not (Test-Path $bootstrap)) { throw "service bootstrap missing: $bootstrap" }
            $cleanup = Start-Process -FilePath $bootstrap -ArgumentList '--uninstall' -PassThru -Wait
            if ($cleanup.ExitCode -ne 0) { throw "TUN service cleanup exited with code $($cleanup.ExitCode)" }
          }
          if (Get-Service -Name $template.serviceName -ErrorAction SilentlyContinue) {
            throw "TUN service remained registered after final cleanup: $($template.serviceName)"
          }
          if (Get-Process -Name 'mihomo' -ErrorAction SilentlyContinue) {
            throw 'mihomo remained after final TUN service cleanup'
          }
          Write-Host 'TUN_SERVICE_FINAL_CLEANUP=PASS'

      - name: List packaged artifacts
        run: |
          Get-ChildItem -Path dist -Filter '*.exe' -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
