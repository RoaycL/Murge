name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the run when this code already passed (version-only bump or a merge
  # whose tree the pull request already tested). See scripts/ci-gate.mjs.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-gate.mjs gate

  verify:
    name: Lint, typecheck, test & build
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go for privileged service
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: native/tun-service/go.sum

      - name: Install dependencies (including development)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Validate brand configuration
        run: npm run brand:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Test and cross-compile privileged TUN service
        run: |
          npm run tun-service:test
          npm run tun-service:build

      - name: Build
        run: npm run build
