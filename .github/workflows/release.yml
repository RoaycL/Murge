name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build x64 and arm64 installers
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go for privileged service
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: native/tun-service/go.sum

      - name: Install dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      # Electron 42+ no longer downloads its binary via a postinstall script;
      # electron-builder needs the binary to package installers.
      - name: Ensure Electron binary is downloaded
        run: npx install-electron --no

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match package.json version '$expectedTag'"
          }

      - name: Verify owner-approved application license
        run: npm run license:check

      # Keep each native command in its own step. PowerShell does not
      # necessarily stop a multiline script when an earlier external command
      # exits non-zero; that previously allowed Windows test failures to become
      # annotations while a later successful build made the release green.
      - name: Validate brand configuration
        run: npm run brand:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Download and verify installer-bundled mihomo archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run kernel:prepare

      - name: Build
        run: npm run build

      - name: Test and build privileged TUN service
        run: |
          npm run tun-service:test
          npm run tun-service:build

      - name: Package Windows installers
        run: npx electron-builder --win --config electron-builder.config.mjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate immutable release notes
        run: npm run release-notes:generate

      - name: Verify owner-approved unsigned release state
        shell: pwsh
        run: |
          $brand = Get-Content brand.config.json -Raw | ConvertFrom-Json
          $unpacked = @(Get-ChildItem -Path dist -Directory -Filter 'win*-unpacked')
          $targets = @(Get-ChildItem -Path dist -Filter '*-Setup-*-*.exe' -File)
          foreach ($dir in $unpacked) {
            $targets += Get-Item (Join-Path $dir.FullName "$($brand.executableName).exe")
            $targets += Get-Item (Join-Path $dir.FullName 'resources\tun-service\tun-service.exe')
          }
          if ($targets.Count -ne 6) { throw "Expected 6 release-owned unsigned executables, found $($targets.Count)" }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Unexpected Authenticode state for intentionally unsigned $($target.FullName): $($signature.Status)"
            }
            Write-Host "INTENTIONALLY_UNSIGNED $($target.FullName)"
          }

      - name: Verify license, notices and source instructions in unpacked artifacts
        shell: pwsh
        run: |
          $unpacked = @(Get-ChildItem -Path dist -Directory -Filter 'win*-unpacked')
          if ($unpacked.Count -ne 2) { throw "Expected two unpacked architectures, found $($unpacked.Count)" }
          foreach ($dir in $unpacked) {
            foreach ($relative in @('resources\LICENSE.txt','resources\THIRD_PARTY_NOTICES.md','resources\SOURCE_CODE.md','LICENSE.electron.txt','LICENSES.chromium.html')) {
              if (-not (Test-Path (Join-Path $dir.FullName $relative))) { throw "$relative missing from $($dir.Name)" }
            }
          }

      - name: Verify release files and generate checksums
        id: assets
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter '*-Setup-*-*.exe' -File | Sort-Object Name)
          if ($installers.Count -ne 2) {
            throw "Expected exactly two per-architecture installers, found $($installers.Count)"
          }
          if (-not ($installers.Name -match '-x64\.exe$')) { throw 'x64 installer is missing' }
          if (-not ($installers.Name -match '-arm64\.exe$')) { throw 'arm64 installer is missing' }

          # Auto-update feed: electron-builder emits `latest.yml` (the channel
          # manifest electron-updater reads) from the github publish config, and
          # bakes `app-update.yml` into each unpacked app so the packaged binary
          # knows its feed. Fail loudly here rather than ship an un-updatable
          # release silently.
          $unpacked = @(Get-ChildItem -Path dist -Directory -Filter 'win*-unpacked')
          $updateFeed = Join-Path $PWD 'dist\latest.yml'
          if (-not (Test-Path $updateFeed)) { throw 'latest.yml update feed is missing from dist' }
          foreach ($dir in $unpacked) {
            $appUpdate = Join-Path $dir.FullName 'resources\app-update.yml'
            if (-not (Test-Path $appUpdate)) { throw "app-update.yml missing from $($dir.Name)" }
          }

          $checksumPath = Join-Path $PWD 'dist\SHA256SUMS.txt'
          $lines = foreach ($file in $installers) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $lines | Set-Content -Path $checksumPath -Encoding ascii
          Get-Content $checksumPath

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $evidencePath = Join-Path $PWD 'dist\release-evidence.json'
          [ordered]@{
            schemaVersion = 1
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            version = $package.version
            supportedArchitectures = @('x64')
            testOnlyArchitectures = @('arm64')
            tunIncluded = $true
            authenticode = 'not-signed-owner-approved'
            windowsPublisherWarning = 'Unknown publisher is expected'
            license = 'GPL-3.0-only'
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $evidencePath -Encoding utf8

          "x64=$((($installers | Where-Object Name -Match '-x64\.exe$').FullName))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "arm64=$((($installers | Where-Object Name -Match '-arm64\.exe$').FullName))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksums=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "updateFeed=$updateFeed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes=$((Join-Path $PWD 'dist\RELEASE_NOTES.md'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "evidence=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Both builds' updaters follow signed release-channel manifests (see
      # src/main/updates/signed-manifest-driver.ts): each installer gets a
      # minisign signature bound to its version and file name, and the stable
      # channel manifest is verified against brand.config.json updatePublicKey
      # before anything is published.
      - name: Sign installers and write the stable channel manifest
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          X64_INSTALLER: ${{ steps.assets.outputs.x64 }}
          ARM64_INSTALLER: ${{ steps.assets.outputs.arm64 }}
          RELEASE_NOTES: ${{ steps.assets.outputs.notes }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is not set' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($installer in @($env:X64_INSTALLER, $env:ARM64_INSTALLER)) {
            # CLI >= 2.12 writes the version into the signed trusted comment.
            npx --yes @tauri-apps/cli@2.12.4 signer sign --app-version $version $installer
            if ($LASTEXITCODE -ne 0) { throw "Signing $installer failed" }
          }
          node scripts/channel-manifest.mjs --version $version --tag $env:GITHUB_REF_NAME --dir dist --notes-file $env:RELEASE_NOTES --out dist/channel-stable/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Writing the stable channel manifest failed' }
          # Published with the installers it signs, so a re-run can move the channel from it.
          Copy-Item dist/channel-stable/latest.json dist/channel-stable.json

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          X64_INSTALLER: ${{ steps.assets.outputs.x64 }}
          ARM64_INSTALLER: ${{ steps.assets.outputs.arm64 }}
          CHECKSUM_FILE: ${{ steps.assets.outputs.checksums }}
          UPDATE_FEED: ${{ steps.assets.outputs.updateFeed }}
          RELEASE_NOTES: ${{ steps.assets.outputs.notes }}
          RELEASE_EVIDENCE: ${{ steps.assets.outputs.evidence }}
        run: |
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') {
              # A re-run after a failed channel update: leave the published
              # release untouched; the next step moves the channel from the
              # manifest published with it.
              $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
              if ($assets -contains 'channel-stable.json') {
                Write-Host "::warning::$env:GITHUB_REF_NAME is already published; only the stable channel is updated"
                exit 0
              }
              throw "Refusing to overwrite an already-published release for $env:GITHUB_REF_NAME"
            }
            gh release upload $env:GITHUB_REF_NAME $env:X64_INSTALLER $env:ARM64_INSTALLER $env:CHECKSUM_FILE $env:UPDATE_FEED $env:RELEASE_EVIDENCE dist/channel-stable.json --clobber
            gh release edit $env:GITHUB_REF_NAME --notes-file $env:RELEASE_NOTES
            # A re-run against a leftover draft publishes it rather than leaving it draft.
            gh release edit $env:GITHUB_REF_NAME --draft=false
          } else {
            # Owner directive: publish directly as a final release, never a draft.
            gh release create $env:GITHUB_REF_NAME $env:X64_INSTALLER $env:ARM64_INSTALLER $env:CHECKSUM_FILE $env:UPDATE_FEED $env:RELEASE_EVIDENCE dist/channel-stable.json --verify-tag --title $env:GITHUB_REF_NAME --notes-file $env:RELEASE_NOTES
          }

      # The channel lives in a fixed pre-release that is never "latest", so
      # GitHub's latest release (and electron-updater's latest.yml for older
      # clients) is unaffected.
      - name: Point the stable update channel at this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view channel-stable --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create channel-stable --target $env:GITHUB_SHA --prerelease --latest=false --title 'Stable update channel' --notes 'Maintained by the release workflow: latest.json here is the signed manifest the stable update channel follows. Do not download from this release.'
            if ($LASTEXITCODE -ne 0) { throw 'Creating the channel-stable release failed' }
          }
          # Always the manifest published with this release's installers, which
          # on a re-run are not the ones this run built and signed.
          $from = New-Item -ItemType Directory -Force -Path dist/channel-from-release
          gh release download $env:GITHUB_REF_NAME --pattern channel-stable.json --dir $from --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Downloading the release channel manifest failed' }
          Move-Item -Force (Join-Path $from 'channel-stable.json') (Join-Path $from 'latest.json')
          gh release upload channel-stable (Join-Path $from 'latest.json') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Updating the stable channel manifest failed' }

      - name: Preserve installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: |
            dist/*-Setup-*-x64.exe
            dist/*-Setup-*-arm64.exe
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/release-evidence.json
            dist/channel-stable/latest.json
          if-no-files-found: error
          retention-days: 30
