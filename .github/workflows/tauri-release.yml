name: Tauri release

# Tag main to publish a signed release:
#
# - `tauri-vX.Y.Z` is a 正式版: a normal GitHub release (the repository's
#   latest), announced on the `update-stable` feed, on `update-beta` unless a
#   newer Beta is there, and on the retired `channel-experimental` feed that
#   Tauri builds up to 0.9.37 still follow.
# - `tauri-vX.Y.Z-beta.N` is a Beta: a GitHub pre-release announced on
#   `update-beta` only ("包括 Beta 版本" in the app).
#
# Each feed is a fixed pre-release holding the signed manifest `latest.json`
# (scripts/release-feeds.mjs decides which feeds move). The retired Electron
# build lives on the `electron-legacy` branch; its last release (v0.9.38)
# holds `channel-stable` and moves its users to `update-stable`.
#
# workflow_dispatch builds, signs and verifies everything with the real key
# without publishing (a dry run before tagging).

on:
  push:
    tags:
      - 'tauri-v*'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tauri-release.yml
      - scripts/tauri-release-assets.mjs
      - scripts/tauri-updater-manifest.mjs
      - scripts/release-feeds.mjs

permissions:
  contents: read

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pull requests: exercise signing + manifest verification with a throwaway
  # key and stand-in files. No secrets, no Windows build.
  signing-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Sign stand-in installers with a throwaway key and verify the manifest
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          work="$RUNNER_TEMP/release-dry-run"
          mkdir -p "$work/keys" "$work/dist"
          npx tauri signer generate --ci -p '' -w "$work/keys/throwaway.key" > /dev/null
          for arch in x64 arm64; do head -c 4096 /dev/urandom > "$work/dist/${product}_${version}_${arch}-setup.exe"; done
          printf -- '- dry run notes\n' > "$work/notes.md"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$work/keys/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD='' \
            node scripts/tauri-release-assets.mjs --version "$version" --tag "tauri-v$version" --dir "$work/dist" \
            --notes-file "$work/notes.md" --pubkey "$(cat "$work/keys/throwaway.key.pub")"
          node -e "const m=require('$work/dist/latest.json'); if (Object.keys(m.platforms).sort().join()!=='windows-aarch64,windows-x86_64' || m.notes!=='- dry run notes\n') process.exit(1)"
          # The real pinned key must reject the throwaway signatures.
          if TAURI_SIGNING_PRIVATE_KEY="$(cat "$work/keys/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD='' \
            node scripts/tauri-release-assets.mjs --version "$version" --tag "tauri-v$version" --dir "$work/dist"; then
            echo 'pinned public key accepted a foreign signature'; exit 1
          fi

  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      product: ${{ steps.check.outputs.product }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag, package.json and Cargo versions must agree
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$cargo_version" != "$version" ]; then
            echo "src-tauri/Cargo.toml version $cargo_version != package.json $version"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "tauri-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match tauri-v$version"; exit 1
          fi
          # 正式版 x.y.z or Beta x.y.z-beta.N; anything else is refused.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "version $version is neither x.y.z nor x.y.z-beta.N"; exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=tauri-v$version" >> "$GITHUB_OUTPUT"
          # The bundler names installers after tauri.conf productName (brand-checked).
          echo "product=$(node -p "require('./src-tauri/tauri.conf.json').productName")" >> "$GITHUB_OUTPUT"

  # Builds never see the signing key; they only produce unsigned installers.
  build:
    needs: version
    name: Windows ${{ matrix.arch }} installer
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Preserve repository LF line endings on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: native/tun-service/go.sum
      - run: npm ci --include=dev
      - run: npm run license:check
      - run: npm run brand:check
      - run: npm run tauri:bridge
      - name: Check generated bridge is unchanged
        run: git diff --exit-code -- src/renderer/src/platform/generated/desktop-api.ts
      - run: npm run typecheck
      - run: npm test
      - name: Prepare pinned kernel and native service resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run kernel:prepare
          npm run tun-service:test
          npm run tun-service:build
      # No Rust cache here: release binaries are built from a clean target.
      - name: Build the per-machine NSIS installer
        run: node scripts/tauri-package.mjs ${{ matrix.arch }}
      - name: Inspect payload architecture
        run: node scripts/ci-tauri-artifact.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - name: Stage the installer
        shell: pwsh
        run: |
          $name = "${{ needs.version.outputs.product }}_${{ needs.version.outputs.version }}_${{ matrix.arch }}-setup.exe"
          $source = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/$name"
          if (-not (Test-Path $source)) { throw "expected installer $source" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/release" | Out-Null
          Copy-Item $source "$env:RUNNER_TEMP/release/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      # The same notes go into the release and into latest.json, where the
      # update dialog shows them. Dry runs (no tag yet) carry none.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # The hand-written Chinese notes the Electron release uses too.
            node scripts/generate-release-notes.mjs
            cp dist/RELEASE_NOTES.md "$RUNNER_TEMP/notes.md"
          else
            : > "$RUNNER_TEMP/notes.md"
          fi
      - name: Sign installers and write latest.json + SHA256SUMS.txt
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          node scripts/tauri-release-assets.mjs
          --version "${{ needs.version.outputs.version }}"
          --tag "${{ needs.version.outputs.tag }}"
          --dir "$RUNNER_TEMP/release"
          --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-release-signed-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRODUCT: ${{ needs.version.outputs.product }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Refusing to overwrite the existing release $TAG"; exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease --latest=false --title "$PRODUCT $VERSION Beta")
          else
            kind=(--latest --title "$PRODUCT $VERSION")
          fi
          cd "$RUNNER_TEMP/release"
          gh release create "$TAG" \
            "${PRODUCT}_${VERSION}_x64-setup.exe" "${PRODUCT}_${VERSION}_x64-setup.exe.sig" \
            "${PRODUCT}_${VERSION}_arm64-setup.exe" "${PRODUCT}_${VERSION}_arm64-setup.exe.sig" \
            latest.json SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Point the update feeds at this release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ensure_feed() {
            if ! gh release view "$1" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$1" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --prerelease --latest=false --title "Update feed: $1" \
                --notes 'Maintained by the Tauri release workflow: latest.json here is the signed manifest the in-app updater follows. Do not download from this release.'
            fi
          }
          # The version the beta feed announces now: a 正式版 must not
          # replace a newer Beta there.
          beta_version=''
          feed_dir="$RUNNER_TEMP/beta-feed"
          mkdir -p "$feed_dir"
          if gh release download update-beta --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$feed_dir" --clobber 2> /dev/null; then
            beta_version=$(node -p "require('$feed_dir/latest.json').version")
          fi
          for feed in $(node scripts/release-feeds.mjs --version "$VERSION" --beta-feed-version "$beta_version"); do
            ensure_feed "$feed"
            gh release upload "$feed" "$RUNNER_TEMP/release/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
            echo "moved $feed to $VERSION"
          done
