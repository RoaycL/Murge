name: Tauri Rust

on:
  push:
    branches: [tauri]
  pull_request:
    branches: [tauri]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional same-repository branch/commit to validate with this CI harness
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-rust-${{ github.event_name }}-${{ github.ref }}-${{ inputs.source_ref || 'default' }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The pinned Linux catalog contains arm64, not linux/x64. Run the
        # actual matching platform rather than skipping host-dependent tests.
        os: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve repository LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Keep the CI preparation script when testing another source branch
        if: github.event_name == 'workflow_dispatch' && inputs.source_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux WebKit and GUI development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --include=dev
      - run: npm run tauri:bridge
      - name: Check generated bridge is unchanged
        run: git diff --exit-code -- src/renderer/src/platform/generated/desktop-api.ts
      - run: npm run kernel:prepare
      - name: Prepare pinned native assets and absolute Node fixture path
        run: node "${{ inputs.source_ref != '' && 'ci-harness/' || '' }}scripts/ci-tauri-prepare.mjs"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust clippy (including tests)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: All Rust tests
        id: rust-tests
        working-directory: src-tauri
        run: cargo test --locked -- --include-ignored
      - name: Diagnose a Windows test executable loader failure
        if: failure() && runner.os == 'Windows' && steps.rust-tests.outcome == 'failure'
        run: node "${{ inputs.source_ref != '' && 'ci-harness/' || '' }}scripts/ci-tauri-loader-diagnostics.mjs"
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows' && steps.rust-tests.outcome == 'failure'
        with:
          name: tauri-windows-loader-diagnostics
          path: ${{ runner.temp }}/tauri-loader-diagnostics/
          if-no-files-found: error

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Preserve repository LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: audit
          cache-on-failure: true
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked
      - name: Audit the committed lockfile (no ignored advisories)
        run: cargo audit --file src-tauri/Cargo.lock
