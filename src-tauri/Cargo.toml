[package]
name = "murge"
version = "0.9.8"
description = "A desktop network client powered by mihomo."
edition = "2021"
rust-version = "1.82"

# Murge is dual-shelled during the migration: the Electron entry lives in
# src/main/, the Tauri shell lives here. The crate name follows
# brand.config.json `executableName` so the packaged binary keeps the same
# on-disk identity.
[lib]
name = "murge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: profile metadata JSON is written byte-compatibly with the
# Electron service, whose `JSON.stringify` emits object keys in insertion
# order (BTreeMap's alphabetical order would rewrite every meta file).
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
# Local-date stamps for the daily log files (file-log-service.ts parity);
# already resolved transitively — no new crates enter the lockfile.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
url = "2"
sha2 = "0.10"
base64 = "0.22"
if-addrs = "0.13"
flate2 = "1"
crc32fast = "1"
regex = "1"
yaml-rust2 = "0.12"
keyring = { version = "3", features = ["windows-native"] }
# The mihomo external-controller REST client. rustls keeps the Linux/CI build
# free of OpenSSL system requirements (clash-verge-rev ships the same choice).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
# Push-stream WebSocket transports (/traffic, /logs, /connections).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tungstenite = "0.24"
once_cell = "1"
# Tray clipboard (复制终端代理命令); pure-Rust, no system deps on Linux CI.
arboard = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "io"] }
# The controller client awaits HTTP; `#[tokio::test]` covers the async paths.
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "sync"] }
boa_engine = "0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
